# Default for tests that do not set an application in @Config (upstream tests use
# manifest = Config.NONE and rely on the plain Application). Without this, the
# includeAndroidResources test option exposes the merged manifest and Robolectric would
# instantiate dev.dimension.flare.App, starting Koin and the createdAtStart coordinators
# (which open the app database - not available in the JVM test environment).
# The push tests override this via @Config(application = Application::class).
application=android.app.Application
